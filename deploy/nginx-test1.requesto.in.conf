# Nginx server block for the Requesto LIVE TEST deployment.
#
# This is a NEW, separate server block — it only responds to test1.requesto.in,
# so your existing site and other folders are untouched.
#
# Install:
#   sudo cp deploy/nginx-test1.requesto.in.conf /etc/nginx/sites-available/test1.requesto.in
#   sudo ln -s /etc/nginx/sites-available/test1.requesto.in /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot (see DEPLOY.md) to add HTTPS — it edits ONLY this block.

server {
    listen 80;
    listen [::]:80;
    server_name test1.requesto.in;

    # Serve the built React app. Adjust the path if you clone elsewhere.
    root /var/www/requesto-test/client/dist;
    index index.html;

    # SPA fallback: client-side routes like /q/abc123 and /dashboard must all
    # return index.html so React Router can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API calls to the Node server (PM2) on localhost. The full /api/
    # path is preserved and passed to Express.
    location /api/ {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
